<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}دبلجة الدارجة{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f3ef;--card:#fff;--ink:#1d1b18;--muted:#6f6a62;--line:#e6e1d8;--brand:#e4572e;--brand-ink:#fff;--ok:#2f8f5b;--warn:#c98a12;--bad:#c53b3b;--soft:#fbf8f3}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}
a{color:inherit}
header{background:var(--ink);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5}
header a{text-decoration:none;font-weight:800;font-size:17px}
header .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--brand);margin-left:8px}
main{max-width:1080px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
h1,h2,h3{margin:0 0 10px;line-height:1.3}
h2{font-size:18px}h3{font-size:15px}
label{display:block;font-weight:700;margin:12px 0 4px;font-size:14px}
.hint{color:var(--muted);font-size:13px;font-weight:400}
input[type=text],input[type=number],textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--soft)}
textarea{min-height:70px;resize:vertical}
input[type=file]{width:100%;padding:8px;border:1px dashed var(--line);border-radius:10px;background:var(--soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.chk{display:flex;gap:8px;align-items:center;font-weight:600;margin-top:10px}
.chk input{width:18px;height:18px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tabs button{border:1px solid var(--line);background:var(--soft);padding:8px 12px;border-radius:999px;font:inherit;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pane{display:none}.pane.on{display:block}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--soft);border:1px solid var(--line);white-space:nowrap}
.b-done{background:#e6f4ec;color:var(--ok);border-color:#c5e6d2}
.b-review{background:#fff4dd;color:var(--warn);border-color:#f1dca8}
.b-error{background:#fbe6e6;color:var(--bad);border-color:#f0c4c4}
.b-work{background:#e8eefc;color:#2f55c4;border-color:#c9d6f6}
.jobs{width:100%;border-collapse:collapse}
.jobs td{padding:10px 6px;border-top:1px solid var(--line);vertical-align:middle}
.jobs tr:hover{background:var(--soft)}
.muted{color:var(--muted)}
.small{font-size:13px}
video{width:100%;max-height:70vh;border-radius:12px;background:#000}
.seg{display:grid;grid-template-columns:70px 70px 1fr 34px;gap:6px;align-items:start;margin-bottom:6px}
.seg input{padding:8px 6px;text-align:center}
.seg textarea{min-height:44px}
.seg .x{border:none;background:none;color:var(--bad);font-size:20px;cursor:pointer}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;text-decoration:none}
.stat b{font-size:18px;display:block}
.ads{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ads a{display:block;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--soft);text-decoration:none}
.ads img{width:100%;display:block;aspect-ratio:1;object-fit:contain;background:#222}
.ads span{display:block;padding:4px 8px;font-size:12px}
.err{background:#fbe6e6;color:var(--bad);border-radius:10px;padding:10px;font-size:13px;white-space:pre-wrap;word-break:break-word}
.note{background:#fff4dd;border-radius:10px;padding:10px;font-size:14px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:s 1s linear infinite;vertical-align:-1px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header><a href="/"><span class="dot"></span>دبلجة الدارجة</a><span class="small" style="opacity:.7">Shopping Net</span></header>
<main>{% block body %}{% endblock %}</main>
{% block js %}{% endblock %}
</body>
</html>
