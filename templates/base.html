<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17140f">
<title>{% block title %}دبلجة الدارجة{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ec;--card:#fff;--ink:#17140f;--muted:#736c62;--line:#e9e3d9;--soft:#faf7f2;
  --brand:#e4572e;--brand-2:#f08a3e;--brand-soft:#fdeee8;--brand-ink:#fff;
  --ok:#21875a;--ok-soft:#e5f5ec;--warn:#b7790b;--warn-soft:#fff3d9;--bad:#c53b3b;--bad-soft:#fdeaea;--info:#2f55c4;--info-soft:#e9effd;
  --r:16px;--shadow:0 1px 2px rgba(23,20,15,.04),0 6px 24px rgba(23,20,15,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12100d;--card:#1c1915;--ink:#f3eee6;--muted:#a59d91;--line:#2e2a24;--soft:#24201b;
  --brand-soft:#3a2119;--ok-soft:#173326;--warn-soft:#3a2d12;--bad-soft:#3d1c1c;--info-soft:#1c2645;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.65}
a{color:inherit}
header{background:linear-gradient(135deg,#17140f 0%,#2a1f17 100%);color:#fff;position:sticky;top:0;z-index:5;box-shadow:0 2px 12px rgba(0,0,0,.15)}
header .in{max-width:1080px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header a{text-decoration:none;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;box-shadow:0 4px 12px rgba(228,87,46,.4)}
.logo svg{width:18px;height:18px}
.brand-name{font-weight:800;font-size:17px;line-height:1.1}
.brand-name small{display:block;font-weight:600;font-size:11px;opacity:.6;letter-spacing:.3px}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15)}
main{max-width:1080px;margin:0 auto;padding:18px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
h1,h2,h3{margin:0 0 12px;line-height:1.35}
h2{font-size:20px;font-weight:800}h3{font-size:16px;font-weight:800}
.title-ico{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--brand-soft);color:var(--brand);margin-left:8px;font-size:15px;vertical-align:middle}
label{display:block;font-weight:700;margin:14px 0 6px;font-size:14px}
.hint{color:var(--muted);font-size:13px;font-weight:400}
input[type=text],input[type=number],textarea,select{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;font:inherit;background:var(--soft);color:var(--ink);transition:border-color .15s,box-shadow .15s,background .15s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand);background:var(--card);box-shadow:0 0 0 4px var(--brand-soft)}
textarea{min-height:84px;resize:vertical}
input[type=file]{width:100%;padding:22px 14px;border:2px dashed var(--line);border-radius:14px;background:var(--soft);color:var(--muted);font:inherit;cursor:pointer;text-align:center}
input[type=file]:hover{border-color:var(--brand);background:var(--brand-soft)}
input[type=file]::file-selector-button{font:inherit;font-weight:700;border:none;background:var(--ink);color:var(--card);padding:8px 14px;border-radius:10px;margin-left:10px;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;min-height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font:inherit;font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink);transition:transform .08s,box-shadow .15s,background .15s}
.btn:hover{background:var(--soft)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));border-color:transparent;color:var(--brand-ink);box-shadow:0 6px 18px rgba(228,87,46,.32)}
.btn.primary:hover{box-shadow:0 8px 24px rgba(228,87,46,.42)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--card)}
.btn.danger{color:var(--bad)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px;border-radius:10px}
.btn.lg{padding:13px 26px;font-size:16px;min-height:50px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.chk{display:flex;gap:10px;align-items:center;font-weight:600;margin-top:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--soft);cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--brand)}
.tabs{display:flex;gap:4px;padding:4px;background:var(--soft);border:1px solid var(--line);border-radius:14px;margin-bottom:6px;overflow-x:auto}
.tabs button{flex:1 1 auto;white-space:nowrap;border:none;background:transparent;padding:9px 12px;border-radius:10px;font:inherit;font-weight:700;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
@media(max-width:600px){.tabs button{padding:8px 6px;font-size:13px}}
.pane{display:none}.pane.on{display:block}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:700;background:var(--soft);border:1px solid var(--line);white-space:nowrap}
.b-done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.b-review{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.b-error{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.b-work{background:var(--info-soft);color:var(--info);border-color:transparent}
.jobs{width:100%;border-collapse:collapse}
.jobs td{padding:12px 8px;border-top:1px solid var(--line);vertical-align:middle}
.jobs tr:first-child td{border-top:none}
.jobs tr:hover{background:var(--soft)}
.jobs a{text-decoration:none}
@media(max-width:600px){
  .jobs,.jobs tbody{display:block}
  .jobs tr{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:12px 4px;border-top:1px solid var(--line)}
  .jobs tr:first-child{border-top:none}
  .jobs td{padding:0;border:none}
  .jobs td:first-child{grid-column:1/-1}
}
.muted{color:var(--muted)}
.small{font-size:13px}
video{width:100%;max-height:70vh;border-radius:12px;background:#000;display:block}
.seg{display:grid;grid-template-columns:76px 76px 1fr 34px;gap:8px;align-items:start;margin-bottom:8px;padding:8px;border-radius:12px;background:var(--soft)}
.seg input{padding:9px 6px;text-align:center;background:var(--card)}
.seg textarea{min-height:46px;background:var(--card)}
.seg .x{border:none;background:none;color:var(--bad);font-size:22px;cursor:pointer;line-height:1;padding-top:8px}
@media(max-width:600px){.seg{grid-template-columns:1fr 1fr 34px}.seg textarea{grid-column:1/3;grid-row:2}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-decoration:none;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;transition:transform .1s}
.stat:hover{transform:translateY(-2px)}
.stat b{font-size:26px;line-height:1.1;font-weight:800}
.stat span{font-size:13px;color:var(--muted);font-weight:600}
.stat.on{outline:2px solid var(--brand)}
.stat.s-review b{color:var(--warn)}.stat.s-done b{color:var(--ok)}.stat.s-error b{color:var(--bad)}
.ads{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ads a{display:block;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--soft);text-decoration:none;transition:transform .1s}
.ads a:hover{transform:translateY(-2px)}
.ads img{width:100%;display:block;aspect-ratio:1;object-fit:contain;background:#1a1714}
.ads span{display:block;padding:6px 10px;font-size:12px;font-weight:600}
.err{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:12px;font-size:13px;white-space:pre-wrap;word-break:break-word}
.note{background:var(--warn-soft);border-radius:12px;padding:12px;font-size:14px}
.empty{text-align:center;padding:28px 10px;color:var(--muted)}
.empty .ico{font-size:34px;display:block;margin-bottom:6px}
.disk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:16px;box-shadow:var(--shadow)}
.disk .bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:8px}
.disk .bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.disk.low{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.disk.low .bar i{background:var(--bad)}
details summary{cursor:pointer}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:s 1s linear infinite;vertical-align:-1px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header><div class="in">
  <a href="/"><span class="logo"><svg viewBox="0 0 24 24" fill="#fff"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10-6.5a1 1 0 0 0 0-1.72l-10-6.5A1 1 0 0 0 8 5.5z"/></svg></span>
    <span class="brand-name">دبلجة الدارجة<small>MONTAGE.SH</small></span></a>
  <span class="pill">Shopping Net</span>
</div></header>
<main>{% block body %}{% endblock %}</main>
{% block js %}{% endblock %}
</body>
</html>
